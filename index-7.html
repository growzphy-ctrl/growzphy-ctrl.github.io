<style>
/* Growzphy - 1% Better Everyday. One narrow column like a pocket study planner; bottom tab bar switches between working views. */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --ink:#0a1a33; --muted:#566379; --line:#d8e0ea;
  --accent:#0a1a33; --accent-ink:#ffffff; --soft:#e8f3d3; --fill:#5f9e12; --lime:#a3e04b;
  --good:#1f7a3d; --good-soft:#dcf1e3; --warn:#9a4d08; --warn-soft:#fbebd3; --bad:#b3261e; --bad-soft:#fbe0dd;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-head:'Anek Bangla','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09111f; --surface:#101c33; --ink:#e9eff8; --muted:#97a6bd; --line:#223250;
    --accent:#a3e04b; --accent-ink:#0a1a33; --soft:#15284a; --fill:#a3e04b; --lime:#a3e04b;
    --good:#6fd08c; --good-soft:#153424; --warn:#f0b35a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1b19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09111f; --surface:#101c33; --ink:#e9eff8; --muted:#97a6bd; --line:#223250;
  --accent:#a3e04b; --accent-ink:#0a1a33; --soft:#15284a; --fill:#a3e04b; --lime:#a3e04b;
  --good:#6fd08c; --good-soft:#153424; --warn:#f0b35a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1b19;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-block:16px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;
}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sync{font-size:.78rem;color:var(--muted);text-align:right;max-width:40%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.quote{border-left:3px solid var(--fill);padding:4px 0 4px 12px;color:var(--ink)}
.sum{display:flex;gap:16px;align-items:center}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--fill);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-family:var(--f-head);font-weight:700;font-size:21px;fill:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{font-size:.84rem;color:var(--muted);line-height:1.3}
.row .m{min-width:0;display:flex;flex-direction:column}
.row .m b{font-weight:600;overflow-wrap:anywhere}
.row.now .t{color:var(--accent);font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.84rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.pill.live{background:var(--soft);color:var(--accent)}
.pill.idle{background:var(--bg);color:var(--muted)}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);margin-left:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill);border-radius:99px}
.bar i.m{background:var(--warn)} .bar i.l{background:var(--bad)}
.bar.exp i{background:var(--muted);opacity:.5}
.note{background:var(--soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.92rem}
.note.warn{background:var(--warn-soft)}
.note.good{background:var(--good-soft)}
.cd{font-family:var(--f-head);font-weight:700;font-size:1.7rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg{overflow-x:auto}
.seg button{flex:1 0 auto;min-height:40px;padding:0 14px;white-space:nowrap;border:0;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hrow{display:grid;grid-template-columns:minmax(84px,32%) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.hrow span:first-child{overflow-wrap:anywhere;line-height:1.25}
.hrow span:last-child{text-align:right;color:var(--muted);min-width:44px;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:.7rem;color:var(--muted);border-radius:10px;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--soft)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
#sheet .in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 120px}
.row .btns .btn{flex:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.92rem;max-width:90%}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.topic{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-height:44px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.topic .bx{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center;font-size:.8rem;line-height:1}
.topic.on .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.topic.on span:last-child{color:var(--muted);text-decoration:line-through}
.empty{padding:18px 0;color:var(--muted);text-align:center}
.hero{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:nowrap}
.brand>div{min-width:0}
.brand b,.brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .cd{font-size:2.3rem;color:var(--accent);line-height:1.2}
.hero .sync{max-width:none;text-align:left}
.exam{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:600}
.tools{display:flex;gap:6px;align-items:center}
.tools .btn{min-width:40px;padding:0 10px}
.tools{flex:none}
.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.dayline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.92rem}
.dayline .dl{font-size:.74rem;letter-spacing:.04em;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 8px;white-space:nowrap}
.speech{font-family:var(--f-head);font-size:1.08rem;line-height:1.5;border-left:3px solid var(--fill);padding:2px 0 2px 12px}
.credit b{font-family:var(--f-head);font-size:1.05rem}
button.credit{background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left;width:100%;cursor:pointer}
.about-top{display:flex;gap:16px;align-items:center}
.portrait{width:132px;height:132px;max-width:34vw;max-height:34vw;border-radius:50%;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.22);flex:none;background:var(--line)}
.about-text p{margin:0 0 .9em;line-height:1.7}
.about-text p:last-child{margin-bottom:0}
.sign{font-family:var(--f-head);font-weight:700}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.soon{opacity:.6;cursor:default;min-height:52px;line-height:1.2}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.credit{display:flex;gap:12px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.avatar.big{width:92px;height:92px}
.logo{display:block;border-radius:10px;box-shadow:0 0 0 1px var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-head);font-size:1.3rem;letter-spacing:.01em;line-height:1.1;display:block}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
.btn .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
[data-act="redit"]{min-width:40px;padding:0 10px}
.tools .help{font-weight:700;font-size:1.05rem;border-radius:99px}
.mot{font-size:.98rem;color:var(--muted)}
.talk{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fill);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.talk-s{font-family:var(--f-head);font-size:1.02rem;line-height:1.65}
.talk-t{font-size:.92rem;line-height:1.6;color:var(--muted)}
.talk-t b{color:var(--ink)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qa summary{list-style:none;padding:12px 16px;min-height:54px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin:-4px 4px 0 0}
.qa details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.qa details[open] summary{color:var(--accent);border-bottom:1px solid var(--line)}
.qa .ans{padding:12px 16px 16px;line-height:1.7;animation:fadein .25s ease}
.qa .ans ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.qa .ans p{margin:0 0 .6em}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tip{background:var(--soft);border-left:4px solid var(--fill);border-radius:12px;padding:14px 16px;line-height:1.7;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--f-head);font-weight:700;font-size:1.55rem;line-height:1.25;overflow-wrap:anywhere}
.tile .k{font-size:.8rem;color:var(--muted);font-weight:600;line-height:1.3}
.tile .d{font-size:.76rem;font-weight:600;line-height:1.3}
.tile .d.up{color:var(--good)} .tile .d.down{color:var(--bad)}
.cwrap{display:grid;grid-template-columns:30px 1fr;column-gap:6px}
.cy{display:flex;flex-direction:column;justify-content:space-between;height:120px;font-size:.66rem;line-height:1;color:var(--muted);text-align:right}
.cplot{display:grid;gap:3px;align-items:end;height:120px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.cb{position:relative;height:100%;display:flex;align-items:flex-end}
.cb i{display:block;width:100%;height:var(--h);background:var(--fill);border-radius:4px 4px 0 0}
.cb.m i{background:var(--warn)} .cb.l i{background:var(--bad)} .cb.n i{background:var(--line)}
.cb .bv{position:absolute;left:-2px;right:-2px;bottom:var(--h);margin-bottom:2px;text-align:center;font-size:.64rem;color:var(--muted);line-height:1}
.cx{grid-column:2;display:grid;gap:3px;margin-top:4px}
.cx span{font-size:.66rem;color:var(--muted);text-align:center;white-space:nowrap;overflow:visible;line-height:1.2}
.cx span.t{color:var(--ink);font-weight:700}
.pomo .cd{font-size:2.6rem;color:var(--accent);line-height:1.1}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);display:block}
.dots i.on{background:var(--fill);border-color:var(--fill)}
.btn.primary:active,.btn:active{transform:scale(.98)}
.btn{transition:transform .1s}
button.credit small{display:block}
@media (prefers-reduced-motion:reduce){.qa .ans{animation:none}.btn{transition:none}.qa summary::after{transition:none}}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
@media (max-width:420px){.hero{padding:16px 14px}.brand{gap:8px}.brand small{display:none}.brand b{font-size:1.12rem}.brand .logo{width:32px;height:32px}.hero .tools{gap:4px}.hero .tools .btn{min-width:36px;width:auto;padding:0 8px}}\n@media (max-width:340px){.hero-top{flex-wrap:wrap}.hero .brand{min-width:112px}}\n</style>

</head>

<noscript><p style="padding:24px;font:16px sans-serif">এই অ্যাপ চালাতে জাভাস্ক্রিপ্ট চালু থাকতে হবে। ফাইলটা Chrome বা Samsung Internet-এ খোলো।</p></noscript>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="বিভাগ"></nav>
<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-live="assertive"><div class="in" id="sheetIn"></div></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var UI={lang:'bn',theme:'system'};
try{var _u=JSON.parse(localStorage.getItem('mentor-ui'));if(_u){UI.lang=_u.lang==='en'?'en':'bn';UI.theme=(_u.theme==='light'||_u.theme==='dark')?_u.theme:'system'}}catch(e){}
(function(){try{var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('mentor-pt-')===0)ks.push(k)}ks.forEach(function(k){localStorage.removeItem(k)})}catch(e){}})();
var EN=UI.lang==='en';
function saveUI(){try{localStorage.setItem('mentor-ui',JSON.stringify(UI))}catch(e){}}
function setTheme(t){UI.theme=t;saveUI();var r=document.documentElement;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}

var p2=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};

var addDays=function(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};

QUOTES=QUOTES.concat([["প্রতিদিন ১% এগোলে এক বছরে তুমি সম্পূর্ণ নতুন একজন।", "Improve by 1% every day and in a year you are a completely new person."], ["ইচ্ছাশক্তির চেয়ে অভ্যাস বেশি শক্তিশালী। অভ্যাসটাই গড়ে তোলো।", "Habit is stronger than willpower. Build the habit."], ["আজকের কষ্টটুকু কাল গর্ব হয়ে ফিরে আসবে।", "Today's effort will come back tomorrow as pride."], ["যে কাজটা এড়াতে চাও, সেটাই আগে করো।", "Do first the task you most want to avoid."], ["ছোট জয়গুলো জমলেই বড় জয় আসে।", "Small wins add up to a big win."], ["শুরুটা যত ছোটই হোক, না শুরু করার চেয়ে ভালো।", "However small the start, it is better than not starting."], ["নিয়মিত থাকা মানেই অর্ধেক সফলতা।", "Being consistent is half of success."], ["তোমার রুটিন তোমার ভবিষ্যতের নকশা।", "Your routine is the blueprint of your future."], ["আজ একটু কষ্ট করলে কাল অনেক সহজ হবে।", "A little hard work today makes tomorrow much easier."], ["কেউ একদিনে বড় হয় না। তুমি শুধু আজকের কাজটা শেষ করো।", "No one grows up in a day. Just finish today's task."], ["মনোযোগ হারিয়ে গেলে বারবার ফিরিয়ে আনো। এটাই অনুশীলন।", "When your focus slips, bring it back again and again. That is the practice."], ["যা শিখছ তা অন্যকে বুঝিয়ে বলো। নিজের বোঝাটা পাকা হবে।", "Explain what you learn to someone else. Your own understanding becomes solid."], ["প্রশ্ন করতে লজ্জা পেয়ো না। প্রশ্ন থেকেই শেখা শুরু।", "Do not be shy to ask questions. Learning starts with a question."], ["ভালো একটা দিন বানাতে চাইলে সকালের প্রথম ঘণ্টাটা ঠিক করো।", "To build a good day, set the first hour of the morning right."], ["দিনের শেষে নিজেকে জিজ্ঞেস করো: আজ কী শিখলাম?", "At the end of the day ask yourself: what did I learn today?"], ["হাল ছেড়ে দেওয়ার আগে মনে করো, কেন শুরু করেছিলে।", "Before you give up, remember why you started."], ["সফল মানুষও ক্লান্ত হয়, তবু পরের দিন আবার শুরু করে।", "Successful people get tired too, yet they start again the next day."], ["বিরতি দুর্বলতা নয়, এটা পরের সেশনের প্রস্তুতি।", "A break is not weakness. It is preparation for the next session."], ["পূর্ণ মনোযোগের ২৫ মিনিট অর্ধমনা দুই ঘণ্টার চেয়ে ভালো।", "Twenty-five minutes of full focus beats two distracted hours."], ["নিজের প্রতি দয়ালু হও, কিন্তু নিজের কাছে কথা রাখো।", "Be kind to yourself, but keep your word to yourself."], ["আজকের একটু বাড়তি চেষ্টা পরীক্ষার আগের রাতে তোমাকে শান্তি দেবে।", "A little extra effort today will give you peace the night before the exam."], ["তুমি একা নও। অনেকেই তোমার মতো চেষ্টা করছে, তুমিও পারবে।", "You are not alone. Many are trying just like you, and you can do it too."], ["ভুল করা মানে তুমি চেষ্টা করছ। ভুল থেকে শিখলেই তুমি জিতলে।", "Making mistakes means you are trying. If you learn from them, you win."], ["লক্ষ্য ঠিক করো, তারপর পথটাকে ছোট ধাপে ভাগ করো।", "Set the goal, then split the path into small steps."], ["সময় সবার জন্য ২৪ ঘণ্টা। তফাত হয় ব্যবহারে।", "Everyone gets 24 hours. The difference is how you use them."], ["আজকের কাজ কালকের জন্য ফেলে রেখো না। কালকের তোমার ওপর বোঝা চাপিয়ো না।", "Do not leave today's work for tomorrow. Do not load a burden on tomorrow's you."], ["এক গ্লাস পানি, একটা গভীর শ্বাস, তারপর আবার শুরু।", "A glass of water, a deep breath, then start again."], ["গোছানো টেবিল গোছানো মনের প্রথম ধাপ।", "A tidy desk is the first step to a tidy mind."], ["ধীরে চলো, কিন্তু থেমো না।", "Walk slowly, but do not stop."], ["কঠিন সময়ই তোমাকে শক্ত করে তোলে।", "Hard times are what make you strong."], ["স্বপ্ন দেখাই যথেষ্ট নয়। প্রতিদিন তার জন্য একটু করে কাজও করো।", "Dreaming is not enough. Work for it a little every day."], ["রাতে ঘুমানোর আগে কালকের তিনটা কাজ ঠিক করে রাখো।", "Before sleeping, decide tomorrow's three tasks."], ["তোমার চেষ্টাই তোমার পরিচয়। ফলাফল পরে আসবে।", "Your effort is your identity. The result will follow."], ["অল্প অল্প করে প্রতিদিন, এটাই সবচেয়ে বড় গোপন কথা।", "A little, every day. That is the biggest secret."], ["নিজেকে বিশ্বাস করো। তুমি যতটা ভাবো, তার চেয়ে এগিয়ে আছ।", "Believe in yourself. You are further along than you think."], ["সকালে উঠে আজকের প্রথম কাজটা বেছে নাও আর সেটা দিয়েই শুরু করো।", "Wake up, pick today's first task and begin with it."], ["এক মিনিট চোখ বন্ধ করে শান্ত হয়ে বসো। মনটা পরিষ্কার হয়ে যাবে।", "Sit quietly with your eyes closed for a minute. Your mind will clear."], ["নোট করে রাখো। যা লিখে রাখো, তা সহজে ভোলা যায় না।", "Take notes. What you write down is not easily forgotten."], ["আজকের সেরা চেষ্টাটাই আগামীকালের ভিত্তি।", "Today's best effort is tomorrow's foundation."], ["যতবার পড়ে যাও, ততবার উঠে দাঁড়াও। এটাই আসল জয়।", "Every time you fall, stand up again. That is the real win."], ["নিয়ম মানলে স্বাধীনতা বাড়ে, কারণ তখন আর বারবার ভাবতে হয় না।", "Discipline brings freedom, because you stop having to decide again and again."], ["শৃঙ্খলা মানে নিজেকে ভালোবাসা, নিজের ভবিষ্যৎকে ভালোবাসা।", "Discipline means loving yourself and loving your future."]]);
SPEECH=SPEECH.concat([["প্রতিদিন সকালে নিজেকে বলো: আজ আমি আমার সেরাটা দেব। সেরা মানে নিখুঁত নয়, সেরা মানে আন্তরিক চেষ্টা। আজ সেটাই করো।", "Each morning tell yourself: today I will give my best. Best does not mean perfect, it means sincere effort. Do that today."], ["কেউ একদিনে বদলে যায় না। কিন্তু প্রতিদিন একটু একটু করে বদলালে একসময় সবাই অবাক হয়ে বলবে, তুমি কীভাবে এত বদলে গেলে?", "Nobody changes in a single day. But if you change a little every day, one day everyone will wonder how you changed so much."], ["আজ যে রুটিনটা মানছ, সেটাই আগামী দিনের তোমাকে গড়ছে। ছোট কাজগুলোকে ছোট ভেবো না।", "The routine you follow today is building the you of tomorrow. Do not think of small tasks as small."], ["মন খারাপ লাগলেও পাঁচ মিনিটের জন্য বই খুলে বসো। শুরু করলেই দেখবে অর্ধেক কঠিনতা কেটে গেছে।", "Even if you feel low, sit with your book for just five minutes. Once you begin, half the difficulty is gone."], ["যে দিনটা ভালো যায়নি, সেটাও তোমাকে কিছু শিখিয়েছে। কী শিখলে তা লিখে রাখো, কাল আরও ভালো করো।", "Even a day that did not go well taught you something. Write down what you learned and do better tomorrow."], ["ফোন স্ক্রল করা আর পড়ার মধ্যে বেছে নিতে হলে আজকের জন্য পড়াটাই বেছে নাও। কাল নিজেকে ধন্যবাদ দেবে।", "If you must choose between scrolling and studying, choose studying today. Tomorrow you will thank yourself."], ["পরীক্ষার ফল একদিনে তৈরি হয় না। আজকের এক ঘণ্টা, কালকের এক ঘণ্টা, এভাবেই তৈরি হয়।", "An exam result is not made in one day. It is made from today's hour, tomorrow's hour, and so on."], ["অন্যের গতি দেখে ভয় পেয়ো না। তোমার পথ তোমার, তোমার গতিও তোমার। শুধু থেমো না।", "Do not be afraid of how fast others are going. Your path and your pace are yours. Just do not stop."], ["নিয়ম মানতে কষ্ট হয়, কিন্তু নিয়ম না মানার ফল আরও কষ্টের। আজ একটু কষ্ট করে নিয়মটা মানো।", "Following rules is hard, but the result of not following them is harder. Put in a little effort and follow your routine today."], ["যখন কাজটা করতে ইচ্ছে করে না, ঠিক তখনই কাজটা তোমাকে শক্ত করে। আজ সেই সুযোগটা নাও।", "The moment you do not feel like doing a task is exactly when it makes you stronger. Take that chance today."], ["শরীরের যত্ন নাও। পানি খাও, সময়মতো ঘুমাও, একটু হাঁটো। সুস্থ শরীরই ভালো পড়ার ভিত্তি।", "Take care of your body. Drink water, sleep on time, walk a little. A healthy body is the base of good study."], ["আজকের লক্ষ্য ছোট করে ধরো: একটা অধ্যায়, একটা অনুশীলন, একটা রিভিশন। ছোট লক্ষ্য পূরণ হলে বড় লক্ষ্যের পথ খুলে যায়।", "Keep today's goal small: one chapter, one practice, one revision. When small goals are met, the way to the big goal opens."], ["ভুল করাকে ভয় পেয়ো না। প্রতিটি ভুল তোমাকে বলে দেয়, কোথায় আরও মনোযোগ দিতে হবে।", "Do not fear mistakes. Each mistake tells you where you need to focus more."], ["ধারাবাহিকতা মানে প্রতিদিন নিখুঁত হওয়া নয়, প্রতিদিন হাজির হওয়া। আজ আবার হাজির হও।", "Consistency does not mean being perfect every day. It means showing up every day. Show up again today."], ["যখন মনে হবে সবকিছু কঠিন, তখন মনে করো আগে কত কঠিন জিনিস তুমি পার করে এসেছ। এটাও পারবে।", "When everything feels hard, remember how many hard things you have already got through. You will get through this too."], ["নিজের কাজের হিসাব রাখাই উন্নতির প্রথম ধাপ। আজ কী করলে তা সৎভাবে জানাও, এতেই নিজের সম্পর্কে সত্যিটা জানা যায়।", "Keeping track of your work is the first step of progress. Report honestly what you did today; that is how you learn the truth about yourself."], ["একটা ভালো সেশন শেষ হলে নিজেকে ছোট একটা পুরস্কার দাও। এতে আগামীকাল শুরু করতে সহজ লাগবে।", "After a good session, give yourself a small reward. It makes starting tomorrow easier."], ["যাঁরা তোমার ওপর ভরসা রাখেন, তাঁদের মুখ মনে করো। তোমার আজকের চেষ্টা তাঁদের জন্যও।", "Remember the faces of those who believe in you. Today's effort is for them too."], ["বড় পরিবর্তন শুরু হয় একটা ছোট সিদ্ধান্ত থেকে। আজ সেই ছোট সিদ্ধান্তটা নাও: এখনই শুরু করো।", "A big change starts with one small decision. Make that small decision today: start right now."], ["বিরতি নেওয়া ভালো, কিন্তু বিরতির পরে ফিরে আসাটা আরও জরুরি। ফিরে আসাই তোমাকে আলাদা করে।", "Taking a break is good, but coming back after it matters more. Coming back is what sets you apart."], ["তুমি যে অভ্যাসগুলো গড়ছ, সেগুলোই একদিন তোমাকে স্বপ্নের কাছে পৌঁছে দেবে। ধৈর্য ধরো।", "The habits you are building will one day take you to your dream. Be patient."], ["ঘুমের আগে আজকের তিনটা ভালো কাজ মনে করো। এতে মন হালকা হয়, আর কালকের জন্য উৎসাহ জন্মায়।", "Before sleep, recall three good things you did today. It lightens the mind and builds energy for tomorrow."], ["সময় নষ্ট হয়ে গেছে ভেবে হতাশ হয়ো না। এই মুহূর্ত থেকেই নতুন করে শুরু করা যায়।", "Do not despair thinking time is wasted. You can start fresh from this very moment."], ["তোমার স্বপ্ন তোমার চেয়ে বড় হতেই পারে। তাই তো সেটা পেতে তুমি প্রতিদিন একটু একটু করে বড় হচ্ছ।", "Your dream may well be bigger than you. That is why you grow a little every day to reach it."], ["আজ যে কাজটা ভয় লাগছে, সেটা দিয়েই দিন শুরু করো। ভয়ের পরের অংশটাই সবচেয়ে সহজ।", "Start your day with the task that scares you. The part after the fear is the easiest."], ["নিজের সাথে করা ছোট প্রতিশ্রুতি রাখো: পাঁচ মিনিট, দশ পৃষ্ঠা, একটা অঙ্ক। প্রতিশ্রুতি রাখাই আত্মবিশ্বাসের উৎস।", "Keep the small promises you make to yourself: five minutes, ten pages, one problem. Keeping promises is the source of confidence."]]);
var PM_ENC=[["দারুণ! ২৫ মিনিট পূর্ণ মনোযোগ দিয়েছ।", "Great! You gave 25 minutes of full focus."], ["অসাধারণ মনোযোগ। এভাবেই এগিয়ে চলো।", "Wonderful focus. Keep going like this."], ["একটা সেশন শেষ, তুমি আরও একধাপ এগিয়েছ।", "One session done, and you moved one step ahead."], ["চমৎকার! এই মনোযোগটাই তোমার শক্তি।", "Excellent! This focus is your strength."]];

    ['তবে ব্রাউজারের সাইট ডেটা মুছে ফেললে বা অ্যাপ সরিয়ে দিলে ডেটা চলে যায়।','But if you clear the browser\'s site data or remove the app, the data is lost.'],

{q:['কাজের হিসাব কীভাবে দেবে?','How do I check in on a task?'],

function period(h){return h<4?T('রাত'):h<6?T('ভোর'):h<12?T('সকাল'):h<15?T('দুপুর'):h<18?T('বিকাল'):h<20?T('সন্ধ্যা'):T('রাত')}
function fmtTime(t){var a=t.split(':').map(Number);if(EN)return (a[0]%12||12)+':'+p2(a[1])+' '+(a[0]<12?'AM':'PM');return period(a[0])+' '+bn(a[0]%12||12)+':'+bn(p2(a[1]))}
function clockTxt(d){var h=d.getHours();if(EN)return (h%12||12)+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+' '+(h<12?'AM':'PM');return period(h)+' '+bn(h%12||12)+':'+bn(p2(d.getMinutes()))+':'+bn(p2(d.getSeconds()))}
function fmtClock(ms){var d=new Date(ms);return fmtTime(p2(d.getHours())+':'+p2(d.getMinutes()))}

/* ---------- state ---------- */
function seed(){
  var all=[0,1,2,3,4,5,6];
  var mk=function(title,time,dur){return {id:uid(),title:title,time:time,dur:dur,subj:title,days:all.slice(),ex:true}};
  var d=new Date(), f=dkey(new Date(d.getFullYear(),d.getMonth(),1)), l=dkey(new Date(d.getFullYear(),d.getMonth()+1,0));
  return {v:1,updated:0,
    routines:[mk(T('সাধারণ পড়া'),'09:00',60),mk(T('অনুশীলন'),'11:00',45),mk(T('রিভিশন'),'17:00',30),mk(T('কাজ'),'20:00',30)],
    timers:[],logs:{},fired:{},notes:[],revs:[],mistakes:[],exams:[],focus:{},me:{name:'',photo:''},pomo:null,
    targets:[{id:uid(),subj:T('সাধারণ পড়া'),unit:T('টি অধ্যায়'),goal:20,from:f,to:l,log:{},topics:[],ex:true}]};
}
function norm(s){s=s&&typeof s==='object'?s:seed();s.routines=(Array.isArray(s.routines)?s.routines:[]).filter(function(r){return r&&typeof r==='object'&&typeof r.time==='string'&&/^\d{1,2}:\d{2}$/.test(r.time)&&Array.isArray(r.days)&&typeof r.id==='string'});s.timers=Array.isArray(s.timers)?s.timers:[];s.targets=Array.isArray(s.targets)?s.targets:[];s.logs=s.logs||{};s.fired=s.fired||{};s.notes=Array.isArray(s.notes)?s.notes:[];s.revs=Array.isArray(s.revs)?s.revs:[];s.mistakes=Array.isArray(s.mistakes)?s.mistakes:[];s.exams=Array.isArray(s.exams)?s.exams:[];s.focus=s.focus||{};s.me=s.me||{name:'',photo:''};s.pomo=s.pomo&&typeof s.pomo==='object'&&/^(focus|short|long|ready)$/.test(s.pomo.phase)&&isFinite(+s.pomo.end)?s.pomo:null;s.updated=s.updated||0;return s}
var S;
try{var _raw=localStorage.getItem(K);S=norm(JSON.parse(_raw))}catch(e){try{if(_raw)localStorage.setItem(K+'-corrupt',_raw)}catch(x){}S=seed()}
(function prune(){var lim=addDays(dkey(),-2);Object.keys(S.fired).forEach(function(k){if(k.slice(0,10)<lim)delete S.fired[k]});var cut=Date.now()-864e5;S.timers=S.timers.filter(function(t){return !t.done||t.at>cut})})();

var ref=null, sync='local', pushT=null, pushing=false, pushAgain=false;
function save(){S.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}queuePush()}
function queuePush(){if(!ref)return;clearTimeout(pushT);pushT=setTimeout(doPush,1200)}
async function doPush(){
  if(!ref)return; if(pushing){pushAgain=true;return}
  pushing=true;
  try{await ref.set({payload:JSON.stringify(S),updated:S.updated});sync='cloud'}catch(e){sync='error'}
  pushing=false; updSync(); if(pushAgain){pushAgain=false;queuePush()}
}
function updSync(){var el=$('#sync');if(!el)return;el.textContent=sync==='cloud'?T('ডেটা অ্যাকাউন্টে সংরক্ষিত'):sync==='error'?T('সংরক্ষণে সমস্যা, আবার চেষ্টা হবে'):T('ডেটা শুধু এই ব্রাউজারে')}
(async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    var db=await window.claude.use('db'), user=await window.claude.use('user');
    if(!db||!user)return;
    var id=await user.id(); if(!id)return;
    ref=db.doc('data/users/'+id+'/state');
    var snap=await ref.get();
    if(snap.exists){
      var d=snap.data();
      if(d&&d.updated>(S.updated||0)){S=norm(JSON.parse(d.payload));try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}
      else if(d&&d.updated<(S.updated||0))queuePush();
    }else queuePush();
    sync='cloud';
  }catch(e){sync='local'}
  updSync();
})();

/* ---------- stats ---------- */
function active(r,k){return r.days.indexOf(parseKey(k).getDay())>=0}
function dayStats(k,nm){
  var today=dkey(), n=0, sum=0, lg=S.logs[k]||{};
  S.routines.forEach(function(r){
    if(!active(r,k))return;
    var l=lg[r.id], counted=l||k<today||(k===today&&nm>=toMin(r.time)+r.dur);
    if(!counted)return; n++; sum+=l?l.p:0;
  });
  return {n:n,avg:n?sum/n:null};
}
function tDone(t){return t.topics&&t.topics.length?t.topics.filter(function(x){return x.on}).length:Object.keys(t.log||{}).reduce(function(a,k){return a+t.log[k]},0)}
function tGoal(t){return t.topics&&t.topics.length?t.topics.length:t.goal}
function tToday(t,k){return t.topics&&t.topics.length?t.topics.filter(function(x){return x.on===k}).length:(t.log&&t.log[k])||0}
function tStat(t,today){
  var goal=tGoal(t), done=tDone(t), total=Math.max(1,diffDays(t.from,t.to)+1);
  var elapsed=Math.min(total,Math.max(0,diffDays(t.from,today)+1)), left=Math.max(0,diffDays(today,t.to)+1);
  var expected=goal*elapsed/total, remain=Math.max(0,goal-done);
  return {goal:goal,done:done,total:total,elapsed:elapsed,left:left,expected:expected,remain:remain,need:left>0?remain/left:remain,plan:goal/total,gap:expected-done};
}

/* ---------- focus mode (pomodoro) ---------- */
var POMO={f:25,s:5,l:15,n:4};
function pomoStart(){var c=(S.pomo&&S.pomo.done)||0,t=Date.now();S.pomo={phase:'focus',start:t,end:t+POMO.f*60000,done:c};save()}
function pomoStop(){
  var P=S.pomo;
  if(P&&P.phase==='focus'){var mins=Math.floor((Date.now()-P.start)/60000);if(mins>=1){S.focus=S.focus||{};var k=dkey();S.focus[k]=(S.focus[k]||0)+Math.min(mins,POMO.f)}}
  S.pomo=null;save();
}
function pomoStep(){
  var P=S.pomo, t=Date.now(); if(!P||P.end>t)return false;
  var dk=dkey(new Date(P.end));
  if(P.phase==='focus'){
    S.focus=S.focus||{};S.focus[dk]=(S.focus[dk]||0)+POMO.f;
    var d=(P.done||0)+1, lg=d>=POMO.n, len=lg?POMO.l:POMO.s;
    S.pomo={phase:lg?'long':'short',start:t,end:t+len*60000,done:lg?0:d};
    enqueue({key:'p'+P.end,kind:'pomo',eb:L('ফোকাস মোড','Focus Mode'),
      title:lg?L('টানা ৪টি সেশন শেষ! অসাধারণ','4 sessions in a row done! Outstanding'):L('২৫ মিনিট শেষ! দারুণ মনোযোগ','25 minutes done! Great focus'),
      sub:lg?L('এবার ১৫ মিনিটের দীর্ঘ বিরতি নাও। পানি খাও আর একটু হেঁটে এসো।','Now take a 15-minute long break. Drink some water and walk around a little.'):L('এবার ৫ মিনিট বিরতি নাও। পানি খাও আর চোখ বিশ্রাম দাও।','Now take a 5-minute break. Drink some water and rest your eyes.'),
      btns:[[L('ঠিক আছে','OK'),'dismiss','primary']]});
  }else if(P.phase==='short'||P.phase==='long'){
    S.pomo={phase:'ready',start:t,end:t,done:P.done||0};
    enqueue({key:'p'+P.end,kind:'pomo',eb:L('ফোকাস মোড','Focus Mode'),title:L('বিরতি শেষ','Break is over'),sub:L('আবার ফোকাস শুরু করবে?','Start focusing again?'),

var RE_D=/^\d{4}-\d{2}-\d{2}$/, RE_T=/^([01]?\d|2[0-3]):[0-5]\d$/;
function sidk(x){return String(x==null?'':x).replace(/[^A-Za-z0-9]/g,'').slice(0,16)}
function cstr(x,n){return typeof x==='string'?x.slice(0,n):''}
function cnum(x,a,b,d){x=+x;return isFinite(x)?Math.min(b,Math.max(a,x)):d}
function cleanData(o){
  if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.routines)||!Array.isArray(o.targets))throw new Error('bad');
  var s={v:1,updated:Date.now(),routines:[],timers:[],logs:{},fired:{},targets:[],notes:[],revs:[],mistakes:[],exams:[],focus:{},me:{name:'',photo:''},pomo:null};
  var arr=function(a,n){return Array.isArray(a)?a.slice(0,n):[]}, obj=function(x){return x&&typeof x==='object'&&!Array.isArray(x)};
  arr(o.routines,300).forEach(function(r){
    if(!obj(r))return; var t=cstr(r.time,5); if(!RE_T.test(t))return; if(t.length===4)t='0'+t;
    var days=arr(r.days,14).map(Number).filter(function(d){return d>=0&&d<=6&&d%1===0}); days=days.filter(function(d,i){return days.indexOf(d)===i}); if(!days.length)return;
    var title=cstr(r.title,60).trim(); if(!title)return;
    var x={id:sidk(r.id)||uid(),title:title,time:t,dur:Math.floor(cnum(r.dur,1,600,30)),subj:cstr(r.subj,30),days:days}; if(r.ex===true)x.ex=true; s.routines.push(x);
  });
  if(obj(o.logs))Object.keys(o.logs).slice(0,1000).forEach(function(k){
    if(!RE_D.test(k)||!obj(o.logs[k]))return; var day={};
    Object.keys(o.logs[k]).slice(0,300).forEach(function(id){var l=o.logs[k][id],i=sidk(id);if(!i||!obj(l))return;day[i]={p:Math.round(cnum(l.p,0,100,0)),why:REASONS.indexOf(l.why)>=0?l.why:'',t:cnum(l.t,0,4e12,0)}});
    s.logs[k]=day;
  });
  arr(o.targets,100).forEach(function(t){
    if(!obj(t)||!RE_D.test(t.from)||!RE_D.test(t.to)||t.to<t.from)return;
    var lg={}; if(obj(t.log))Object.keys(t.log).slice(0,800).forEach(function(k){if(RE_D.test(k))lg[k]=cnum(t.log[k],0,100000,0)});
    var tp=arr(t.topics,300).filter(obj).map(function(x){return {n:cstr(x.n,80),on:RE_D.test(x.on)?x.on:null}}).filter(function(x){return x.n});
    var subj=cstr(t.subj,40).trim(); if(!subj)return;
    var x={id:sidk(t.id)||uid(),subj:subj,unit:cstr(t.unit,20)||T('টি'),goal:Math.max(1,cnum(t.goal,1,100000,1)),from:t.from,to:t.to,log:lg,topics:tp}; if(t.ex===true)x.ex=true; s.targets.push(x);
  });
  arr(o.notes,1000).forEach(function(n){if(!obj(n))return;var tx=cstr(n.text,2000);if(!tx.trim())return;s.notes.push({id:sidk(n.id)||uid(),text:tx,ts:cnum(n.ts,0,4e12,Date.now())})});
  arr(o.revs,1000).forEach(function(r){if(!obj(r)||!RE_D.test(r.learned))return;var tp=cstr(r.topic,80).trim();if(!tp)return;s.revs.push({id:sidk(r.id)||uid(),topic:tp,subj:cstr(r.subj,30),learned:r.learned,step:Math.floor(cnum(r.step,0,RINT.length,0))})});
  arr(o.mistakes,1000).forEach(function(m){if(!obj(m))return;var q=cstr(m.q,500);if(!q.trim())return;s.mistakes.push({id:sidk(m.id)||uid(),q:q,a:cstr(m.a,500),subj:cstr(m.subj,30),ts:cnum(m.ts,0,4e12,Date.now()),fixed:m.fixed===true})});
  arr(o.exams,100).forEach(function(e){if(!obj(e)||!RE_D.test(e.date))return;var nm=cstr(e.name,40).trim();if(!nm)return;s.exams.push({id:sidk(e.id)||uid(),name:nm,date:e.date})});
  if(obj(o.focus))Object.keys(o.focus).slice(0,1000).forEach(function(k){if(RE_D.test(k))s.focus[k]=Math.floor(cnum(o.focus[k],0,1440,0))});
  if(obj(o.me)){s.me.name=cstr(o.me.name,40);var ph=cstr(o.me.photo,200000);if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(ph))s.me.photo=ph}
  return s;
}

function vReport(){

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case 'tab':tab=el.dataset.t;render();window.scrollTo(0,0);break;
    case 'check':{var r=byId(S.routines,id);if(r)openCheck(r);break}
    case 'dismiss':closeSheet();break;
    case 'pick':{cur.p=+el.dataset.p;if(cur.p===100)finishCheck('');else{cur.step='why';renderSheet()}break}
    case 'why':{var i=+el.dataset.w;finishCheck(i>=0?REASONS[i]:'');break}
    case 'snooze':{var t=cur.t,m=+el.dataset.m;S.timers.push({id:uid(),title:t.title,kind:t.kind,at:Date.now()+m*60000,done:false});save();closeSheet();if(tab==='timers')render();toast(bn(m)+T(' মিনিট পরে আবার ডাকব'));break}
    case 'range':range=+el.dataset.r;render();break;
    case 'msub':more=el.dataset.s;render();break;
    case 'shareapp':{var sd={title:'Growzphy',text:'Growzphy - 1% Better Everyday',url:SITE_URL};if(navigator.share)navigator.share(sd).catch(function(){});else copyText(SITE_URL);break}
    case 'copylink':copyText(SITE_URL);break;
    case 'goabout':tab='more';more='about';render();window.scrollTo(0,0);break;
    case 'help':if(tab!=='help'){prevTab=tab;tab='help';try{history.pushState(null,'','#help')}catch(x){}}render();window.scrollTo(0,0);break;
    case 'back':if(location.hash==='#help'){history.back()}else{tab=prevTab||'today';render();window.scrollTo(0,0)}break;
    case 'pstart':pomoStart();if(cur&&cur.kind==='pomo')closeSheet();render();toast(L('ফোকাস শুরু হলো। মন দিয়ে পড়ো!','Focus started. Study with full attention!'));break;
    case 'pstop':pomoStop();if(cur&&cur.kind==='pomo')closeSheet();render();break;
    case 'pskip':pomoStart();render();toast(L('নতুন ফোকাস শুরু হলো','A new focus session has started'));break;
    case 'lang':case 'setlang':{var nl=a==='lang'?(EN?'bn':'en'):el.dataset.l;if(nl===UI.lang)break;UI.lang=nl;saveUI();location.reload();break}
    case 'theme':case 'settheme':{var order=['system','light','dark'],nt=a==='theme'?order[(order.indexOf(UI.theme)+1)%3]:el.dataset.th;setTheme(nt);render();break}
    case 'aiq':askAI(el.dataset.q);break;
    case 'focus':{var fm=+el.dataset.m;S.timers.push({id:uid(),title:T('ফোকাস শেষ। একটু বিরতি নাও'),kind:'timer',focus:fm,at:Date.now()+fm*60000,done:false});save();render();toast(bn(fm)+T(' মিনিটের ফোকাস শুরু'));break}
    case 'ncopy':{var nn=byId(S.notes,id);if(nn)copyText(nn.text);break}
    case 'nshare':{var ns2=byId(S.notes,id);if(ns2&&navigator.share)navigator.share({text:ns2.text}).catch(function(){});break}
    case 'ndel':arm(el,function(){S.notes=S.notes.filter(function(x){return x.id!==id});save();render()});break;
    case 'gorev':tab='more';more='rev';render();window.scrollTo(0,0);break;
    case 'rvok':{var rv=byId(S.revs,id);if(rv){rv.step++;save();render();toast(rv.step>=RINT.length?T('সব রিভিশন শেষ, দারুণ'):T('ঠিক আছে, পরের রিভিশনের দিন ঠিক হলো'))}break}
    case 'rvbad':{var rb=byId(S.revs,id);if(rb){rb.learned=dkey();rb.step=0;save();render();toast(T('আবার প্রথম থেকে, কাল দেখো'))}break}
    case 'rvdel':arm(el,function(){S.revs=S.revs.filter(function(x){return x.id!==id});save();render()});break;
    case 'xfix':{var xm=byId(S.mistakes,id);if(xm){xm.fixed=!xm.fixed;save();render()}break}
    case 'xdel':arm(el,function(){S.mistakes=S.mistakes.filter(function(x){return x.id!==id});save();render()});break;
    case 'edel':arm(el,function(){S.exams=S.exams.filter(function(x){return x.id!==id});save();render()});break;
    case 'phrem':S.me.photo='';save();render();break;
    case 'dayt':el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')==='true'?'false':'true');break;
    case 'rdel':arm(el,function(){S.routines=S.routines.filter(function(x){return x.id!==id});save();render()});break;
    case 'redit':{var r2=byId(S.routines,id);if(!r2)break;var f=$('#rform');f.dataset.id=id;$('#rf-title').value=r2.title;$('#rf-time').value=r2.time;$('#rf-dur').value=r2.dur;$('#rf-subj').value=r2.subj||'';document.querySelectorAll('#rf-days .chip').forEach(function(c){c.setAttribute('aria-pressed',r2.days.indexOf(+c.dataset.d)>=0)});$('#rformT').textContent=T('কাজ বদলাও');$('#rf-save').textContent=T('সংরক্ষণ করো');$('#rf-cancel').hidden=false;f.scrollIntoView({behavior:'smooth',block:'center'});break}
    case 'rcancel':render();break;
    case 'sleep':{var hrs=parseFloat($('#sl-h').value);if(!(hrs>0)){toast(T('ঘণ্টা সঠিকভাবে দাও'));break}S.timers=S.timers.filter(function(t){return t.kind!=='wake'||t.done});S.timers.push({id:uid(),title:T('ঘুম থেকে ওঠার সময়'),kind:'wake',at:Date.now()+hrs*3600000,done:false});save();render();toast(T('শুভরাত্রি। ')+fmtClock(Date.now()+hrs*3600000)+T(' এ ডাকব'));break}
    case 'tdel':S.timers=S.timers.filter(function(t){return t.id!==id});save();render();break;
    case 'wl':if(wl){try{wlock&&wlock.release()}catch(x){}wl=false;toast(T('বন্ধ করা হলো'))}else reqWL().then(function(){if(wl)toast(T('স্ক্রিন জেগে থাকবে'))});break;
    case 'tadd':{var t1=byId(S.targets,id),n=+el.dataset.n,k=dkey();t1.log=t1.log||{};t1.log[k]=Math.max(0,(t1.log[k]||0)+n);save();render();break}
    case 'topic':{var t2=byId(S.targets,id),i2=+el.dataset.i,tp=t2.topics[i2];tp.on=tp.on?null:dkey();save();var d=document.querySelector('details');var open=d&&d.open;render();if(open){var dd=document.querySelector('details');if(dd)dd.open=true}break}
    case 'tgdel':arm(el,function(){S.targets=S.targets.filter(function(x){return x.id!==id});save();render()});break;
    case 'export':doExport();break;
    case 'impok':S=norm(pendingImport);pendingImport=null;save();render();toast(T('ডেটা ফেরানো হয়েছে'));break;
    case 'impno':pendingImport=null;render();break;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='m-photo'){
    var pf=e.target.files&&e.target.files[0]; if(!pf)return;
    var pr=new FileReader();
    pr.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),z=200;c.width=c.height=z;var mn=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-mn)/2,(im.height-mn)/2,mn,mn,0,0,z,z);S.me=S.me||{name:'',photo:''};S.me.photo=c.toDataURL('image/jpeg',.82);save();render();toast(T('ছবি যোগ হয়েছে'))};im.onerror=function(){toast(T('ছবিটা পড়া গেল না'))};im.src=pr.result};
    pr.readAsDataURL(pf); return;
  }
  if(e.target.id!=='impf')return;
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  if(f.size>3*1024*1024){toast(T('ফাইলটা ঠিক নেই'));return}
  var rd=new FileReader();
  rd.onload=function(){try{pendingImport=cleanData(JSON.parse(rd.result));render()}catch(x){toast(T('ফাইলটা ঠিক নেই'))}};
  rd.readAsText(f);
});
document.addEventListener('submit',function(e){
  e.preventDefault(); var f=e.target;
  if(f.id==='rform'){
    var days=[];document.querySelectorAll('#rf-days .chip').forEach(function(c){if(c.getAttribute('aria-pressed')==='true')days.push(+c.dataset.d)});
    if(!days.length){toast(T('অন্তত একটা দিন বেছে নাও'));return}
    var o={title:$('#rf-title').value.trim(),time:$('#rf-time').value,dur:Math.max(1,parseInt($('#rf-dur').value,10)||30),subj:$('#rf-subj').value.trim(),days:days};
    if(!o.title)return;
    if(f.dataset.id){var r=byId(S.routines,f.dataset.id);Object.assign(r,o);delete r.ex}else{o.id=uid();S.routines.push(o)}
    save();render();toast(T('রুটিন সংরক্ষণ হয়েছে'));
  }else if(f.id==='tform'){
    var m=Math.max(1,parseInt($('#tm-n').value,10)||1)*parseInt($('#tm-u').value,10);
    S.timers.push({id:uid(),title:$('#tm-title').value.trim(),kind:'timer',at:Date.now()+m*60000,done:false});
    save();render();toast(T('টাইমার চালু হয়েছে'));
  }else if(f.id==='aform'){
    var qv=$('#ai-q').value; askAI(qv);
  }else if(f.id==='vform'){
    S.revs.push({id:uid(),topic:$('#v-topic').value.trim(),subj:$('#v-subj').value.trim(),learned:$('#v-date').value,step:0});save();render();toast(T('রিভিশনে যোগ হয়েছে'));
  }else if(f.id==='xform'){
    S.mistakes.push({id:uid(),q:$('#x-q').value.trim(),a:$('#x-a').value.trim(),subj:$('#x-s').value.trim(),ts:Date.now(),fixed:false});save();render();toast(T('খাতায় তোলা হয়েছে'));
  }else if(f.id==='eform'){
    S.exams.push({id:uid(),name:$('#e-name').value.trim(),date:$('#e-date').value});save();render();toast(T('পরীক্ষা যোগ হয়েছে'));
  }else if(f.id==='nform'){
    var nt=$('#n-text').value.trim(); if(!nt)return;
    S.notes.push({id:uid(),text:nt,ts:Date.now()});save();render();toast(T('নোট রাখা হয়েছে'));
  }else if(f.id==='mform'){
    S.me=S.me||{name:'',photo:''};S.me.name=$('#m-name').value.trim();save();render();toast(T('সংরক্ষণ হয়েছে'));
  }else if(f.id==='gform'){
    var tp=$('#tf-topics').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).map(function(n){return {n:n,on:null}});
    var from=$('#tf-from').value, to=$('#tf-to').value;
    if(to<from){toast(T('শেষ তারিখ শুরুর আগে হতে পারে না'));return}
    S.targets.push({id:uid(),subj:$('#tf-subj').value.trim(),unit:$('#tf-unit').value.trim()||T('টি'),goal:Math.max(1,parseInt($('#tf-goal').value,10)||1),from:from,to:to,log:{},topics:tp});
    save();render();toast(T('লক্ষ্য যোগ হয়েছে'));
  }
});

(function(){var hh=(location.hash||'').replace('#','');if(hh==='about'){tab='more';more='about'}else if(hh==='help'){tab='help'}})();
window.addEventListener('popstate',function(){if(tab==='help'&&location.hash!=='#help'){tab=prevTab||'today';render();window.scrollTo(0,0)}else if(tab!=='help'&&location.hash==='#help'){prevTab=tab;tab='help';render();window.scrollTo(0,0)}});
render();
tick();
})();
</script>
